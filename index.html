<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prefeitura Municipal de Nerópolis - Demonstrativo Financeiro</title>
    <!-- Tailwind CSS para UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1E3A8A',     /* Azul Escuro Institucional */
                            lightBlue: '#2563EB', /* Azul Destaque */
                            orange: '#F97316',    /* Laranja Vibrante */
                            orangeHover: '#EA580C'
                        }
                    }
                }
            }
        }
    </script>
    <!-- SheetJS para leitura do Excel/CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .table-num { font-variant-numeric: tabular-nums; }
        .drawer-overlay { background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); transition: opacity 0.3s ease; }
        .drawer { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            max-width: 80vw;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }
    </style>
</head>
<body class="text-slate-800 relative min-h-screen">

    <!-- Marca d'água de fundo -->
    <div class="watermark-bg flex items-center justify-center text-center">
        <h1 class="text-6xl font-bold text-slate-400">PREFEITURA DE NERÓPOLIS</h1>
    </div>

    <!-- Conteúdo Principal -->
    <div class="relative z-10 max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-brand-blue">Demonstrativo Financeiro</h1>
                <p class="text-sm text-slate-500">Prefeitura Municipal de Nerópolis</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFile(event)">
                <button onclick="document.getElementById('excelFile').click()" class="bg-brand-blue hover:bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors shadow-sm">
                    <i data-lucide="upload" class="w-4 h-4"></i> Carregar Planilha
                </button>
            </div>
        </header>

        <!-- Tabela Principal -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold uppercase text-xs">
                        <tr>
                            <th class="py-3 px-4">Conta</th>
                            <th class="py-3 px-4">Descrição</th>
                            <th class="py-3 px-4 text-right">Saldo Final (R$)</th>
                            <th class="py-3 px-4 text-center">Classificação Final</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-slate-400">Carregue um arquivo para visualizar os dados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Drawer Lateral -->
    <div id="drawerOverlay" class="fixed inset-0 drawer-overlay opacity-0 pointer-events-none z-40" onclick="closeDrawer()"></div>
    <div id="drawer" class="fixed top-0 right-0 w-full max-w-md h-full bg-white shadow-2xl z-50 drawer transform translate-x-full flex flex-col">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <div class="flex items-center gap-2">
                <button id="btnBack" onclick="renderTcmLevel()" class="hidden p-1 hover:bg-slate-200 rounded text-slate-600">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h3 id="drawerTitle" class="font-bold text-slate-800 text-lg">Visão por TCM</h3>
            </div>
            <button onclick="closeDrawer()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="drawerSubTitle" class="px-4 py-2 bg-blue-50 text-xs font-semibold text-brand-blue border-b border-blue-100 hidden"></div>
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4" id="drawerContent">
            <!-- Conteúdo dinâmico do drawer -->
        </div>
    </div>

    <script>
        let rawData = [];
        let columnKeys = {
            conta: '',
            descricao: '',
            saldoFinal: '',
            classificacaoFinal: '',
            tcm: ''
        };

        lucide.createIcons();

        // Normaliza texto removendo acentos e espaços extras para busca flexível
        function normalizeText(text) {
            if (!text) return '';
            return text.toString()
                       .normalize("NFD")
                       .replace(/[\u0300-\u036f]/g, "")
                       .toUpperCase()
                       .trim();
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Converte a planilha em objetos onde as chaves são os nomes das colunas
                rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                if (rawData.length > 0) {
                    mapColumnNames(Object.keys(rawData[0]));
                }

                renderMainTable();
            };
            reader.readAsArrayBuffer(file);
        }

        // Mapeia dinamicamente os nomes das colunas encontradas no cabeçalho
        function mapColumnNames(headers) {
            columnKeys = { conta: '', descricao: '', saldoFinal: '', classificacaoFinal: '', tcm: '' };

            headers.forEach(header => {
                const norm = normalizeText(header);
                
                if (norm.includes('CONTA')) columnKeys.conta = header;
                else if (norm.includes('DESCRICAO') || norm.includes('HISTORICO')) columnKeys.descricao = header;
                else if (norm.includes('SALDO FINAL') || norm.includes('SALDO_FINAL') || norm === 'SALDO') columnKeys.saldoFinal = header;
                else if (norm.includes('CLASSIFICACAO') || norm.includes('CLASSIFICACAO FINAL')) columnKeys.classificacaoFinal = header;
                else if (norm.includes('TCM')) columnKeys.tcm = header;
            });
        }

        function formatCurrency(val) {
            const num = parseFloat(val) || 0;
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function renderMainTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (rawData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-400">Nenhum dado encontrado.</td></tr>';
                return;
            }

            rawData.forEach((row, index) => {
                const conta = row[columnKeys.conta] || '-';
                const descricao = row[columnKeys.descricao] || '-';
                const saldoFinal = parseFloat(row[columnKeys.saldoFinal]) || 0;
                const classificacaoFinal = row[columnKeys.classificacaoFinal] || '-';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";
                
                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono text-xs text-slate-500">${conta}</td>
                    <td class="py-3 px-4 text-slate-700">${descricao}</td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="openDrawer(${index})" class="font-semibold text-brand-lightBlue hover:text-brand-blue hover:underline table-num">
                            ${formatCurrency(saldoFinal)}
                        </button>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">
                            ${classificacaoFinal}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openDrawer(rowIndex) {
            document.getElementById('drawerOverlay').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('drawer').classList.remove('translate-x-full');
            
            renderTcmLevel();
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('drawer').classList.add('translate-x-full');
        }

        // Nível 1: Agrupado pelo nome do TCM
        function renderTcmLevel() {
            document.getElementById('btnBack').classList.add('hidden');
            document.getElementById('drawerTitle').innerText = 'Visão por TCM';
            
            const subTitle = document.getElementById('drawerSubTitle');
            subTitle.classList.add('hidden');

            const content = document.getElementById('drawerContent');
            content.innerHTML = '';

            const tcmGroup = {};
            rawData.forEach(row => {
                const tcmKey = row[columnKeys.tcm] || 'Não Classificado';
                const valor = parseFloat(row[columnKeys.saldoFinal]) || 0;
                
                if (!tcmGroup[tcmKey]) {
                    tcmGroup[tcmKey] = 0;
                }
                tcmGroup[tcmKey] += valor;
            });

            const list = document.createElement('div');
            list.className = 'space-y-2';

            Object.keys(tcmGroup).forEach(tcmName => {
                const total = tcmGroup[tcmName];
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-200 rounded-lg cursor-pointer flex justify-between items-center transition-all';
                item.onclick = () => renderDescriptionLevel(tcmName);
                
                item.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-medium text-slate-700 text-sm">${tcmName}</span>
                        <span class="text-xs text-slate-400">Clique para ver as descrições</span>
                    </div>
                    <span class="font-bold text-slate-900 text-sm table-num">${formatCurrency(total)}</span>
                `;
                list.appendChild(item);
            });

            content.appendChild(list);
        }

        // Nível 2: Detalhamento pelo nome da Descrição dentro do TCM selecionado
        function renderDescriptionLevel(tcmName) {
            document.getElementById('btnBack').classList.remove('hidden');
            document.getElementById('drawerTitle').innerText = 'Detalhamento por Descrição';
            
            const subTitle = document.getElementById('drawerSubTitle');
            subTitle.innerText = `Filtro TCM: ${tcmName}`;
            subTitle.classList.remove('hidden');

            const content = document.getElementById('drawerContent');
            content.innerHTML = '';

            const descGroup = {};
            rawData.forEach(row => {
                const rowTcm = row[columnKeys.tcm] || 'Não Classificado';
                if (rowTcm === tcmName) {
                    const descKey = row[columnKeys.descricao] || 'Sem Descrição';
                    const valor = parseFloat(row[columnKeys.saldoFinal]) || 0;
                    
                    if (!descGroup[descKey]) {
                        descGroup[descKey] = 0;
                    }
                    descGroup[descKey] += valor;
                }
            });

            const list = document.className = 'div';
            const container = document.createElement('div');
            container.className = 'space-y-2';

            Object.keys(descGroup).forEach(descName => {
                const total = descGroup[descName];
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center';
                
                item.innerHTML = `
                    <span class="font-medium text-slate-700 text-sm pr-2">${descName}</span>
                    <span class="font-semibold text-slate-900 text-sm table-num whitespace-nowrap">${formatCurrency(total)}</span>
                `;
                container.appendChild(item);
            });

            content.appendChild(container);
        }
    </script>
</body>
</html>
